name: iPhone Safari WebKit Build - Intruder

on:
  push:
    branches: [iphone-ready]
    paths:
      - 'index.html'
      - 'assets/pow/**'
      - 'tests/iphone-webkit-browser.cjs'
      - 'tests/pow-controls-browser.cjs'
      - 'tests/pow-m21-browser.cjs'
      - '.github/workflows/iphone-ready.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-ready
  cancel-in-progress: false

jobs:
  iphone-safari:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout all history for original asset verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install WebKit and Chromium browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Verify iPhone Safari WebKit launch, touchscreen and rotation
        run: node tests/iphone-webkit-browser.cjs
      - name: Verify chromium touch controls, rope and prison physics
        run: |
          node tests/run-browser.cjs --suite=controls
          node tests/run-browser.cjs --suite=prison
      - name: Verify extended Milestone 2.1 POW logic and browser sequences
        run: npm run test:m21
      - name: Package full Netlify site
        run: npm run build
      - name: Smoke-test exact packaged WebGL flight, POW and photo files
        run: npm run test:build
      - name: Release iPhone-ready ZIP only after all tests pass
        shell: bash
        run: |
          set -euo pipefail
          cp dist/Intruder_Yankee_Station_Milestone2_1.zip releases/Intruder_Yankee_Station_Milestone2_1_iPhone_Ready.zip
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          p=Path("releases/Intruder_Yankee_Station_Milestone2_1_iPhone_Ready.zip")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              entries=set(z.namelist())
              for name in ("index.html","assets/pow/core.js","assets/pow/core.css","_headers"):
                  assert name in entries,name
              js=z.read("assets/pow/core.js").decode("utf-8")
              css=z.read("assets/pow/core.css").decode("utf-8")
              assert "roof-rope:marker-bar" in js
              assert "touchRun" in js and "touchCrouch" in js
              assert "iPhone Safari / landscape POW layout" in css
              assert not any(k.startswith((".git/","tests/","reference_media/","archive/")) for k in entries)
          print("PASS verified Netlify ZIP",p.stat().st_size,"bytes SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Intruder_Yankee_Station_Milestone2_1_iPhone_Ready.zip
          git commit -m "Release iPhone-ready tested Milestone 2.1 playable game"
          git push origin HEAD:iphone-ready
      - name: Backup artifact for manual download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Intruder_iPhone_Ready_Build
          path: dist/Intruder_Yankee_Station_Milestone2_1.zip
          if-no-files-found: ignore
          retention-days: 30
